<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>StockOS -- Live Demo</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --bg:#0a0f1e;
    --surface:#111827;
    --surface2:#1a2236;
    --border:#1f2d45;
    --green:#00d37f;
    --green-dim:rgba(0,211,127,0.12);
    --orange:#ff8c42;
    --orange-dim:rgba(255,140,66,0.12);
    --red:#ff4d6d;
    --red-dim:rgba(255,77,109,0.12);
    --blue:#4d9eff;
    --blue-dim:rgba(77,158,255,0.1);
    --text:#e8edf5;
    --muted:#6b7a99;
    --font:'DM Sans',sans-serif;
    --mono:'DM Mono',monospace;
  }
  body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}

  /* TOP NAV */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 20px;
    background:rgba(10,15,30,0.95);
    border-bottom:1px solid var(--border);
    position:sticky;top:0;z-index:100;
    backdrop-filter:blur(12px);
  }
  .logo{font-size:1.1rem;font-weight:700;letter-spacing:-0.3px;}
  .logo span{color:var(--green);}
  .live-badge{
    display:flex;align-items:center;gap:6px;
    background:var(--green-dim);border:1px solid rgba(0,211,127,0.3);
    color:var(--green);font-size:0.72rem;font-weight:600;
    padding:5px 10px;border-radius:100px;font-family:var(--mono);
  }
  .live-dot{width:6px;height:6px;background:var(--green);border-radius:50%;animation:pulse 1.5s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}

  /* TABS */
  .tabs{
    display:flex;gap:4px;padding:12px 16px;
    border-bottom:1px solid var(--border);
    overflow-x:auto;scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    padding:8px 16px;border-radius:8px;font-size:0.82rem;font-weight:600;
    cursor:pointer;white-space:nowrap;transition:all 0.2s;
    border:1px solid transparent;color:var(--muted);
  }
  .tab.active{background:var(--green-dim);color:var(--green);border-color:rgba(0,211,127,0.3);}

  /* MAIN */
  .main{padding:16px;}

  /* ALERT BANNER */
  .alert-banner{
    background:var(--red-dim);border:1px solid rgba(255,77,109,0.3);
    border-radius:12px;padding:14px 16px;margin-bottom:16px;
    display:flex;align-items:flex-start;gap:12px;
    animation:slideIn 0.4s ease;cursor:pointer;transition:opacity 0.2s;
  }
  .alert-banner:hover{opacity:0.85;}
  @keyframes slideIn{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
  .alert-icon{font-size:1.1rem;margin-top:1px;}
  .alert-title{font-size:0.85rem;font-weight:700;color:var(--red);margin-bottom:3px;}
  .alert-desc{font-size:0.78rem;color:#c8a0aa;line-height:1.5;}

  /* STATS ROW */
  .stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px;}
  .stat-card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:12px;padding:14px 12px;text-align:center;
  }
  .stat-num{font-size:1.5rem;font-weight:700;font-family:var(--mono);margin-bottom:3px;}
  .stat-label{font-size:0.7rem;color:var(--muted);font-weight:500;}
  .stat-card.danger .stat-num{color:var(--red);}
  .stat-card.warn .stat-num{color:var(--orange);}
  .stat-card.good .stat-num{color:var(--green);}

  /* SECTION TITLE */
  .section-title{
    font-size:0.72rem;font-weight:700;color:var(--muted);
    text-transform:uppercase;letter-spacing:1.2px;
    margin-bottom:10px;margin-top:20px;
  }

  /* LOCATION CARDS */
  .loc-card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:12px;padding:16px;margin-bottom:10px;
    cursor:pointer;transition:all 0.2s;
    border-left:3px solid transparent;
  }
  .loc-card:hover{border-color:var(--border);background:var(--surface2);}
  .loc-card.selected{border-left-color:var(--green);background:var(--surface2);}
  .loc-card.alert-loc{border-left-color:var(--red);}
  .loc-card.warn-loc{border-left-color:var(--orange);}
  .loc-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
  .loc-name{font-size:0.92rem;font-weight:700;}
  .loc-address{font-size:0.73rem;color:var(--muted);margin-top:2px;}
  .loc-badge{
    font-size:0.68rem;font-weight:700;padding:4px 8px;
    border-radius:6px;font-family:var(--mono);white-space:nowrap;
  }
  .badge-ok{background:var(--green-dim);color:var(--green);}
  .badge-warn{background:var(--orange-dim);color:var(--orange);}
  .badge-alert{background:var(--red-dim);color:var(--red);}
  .stock-bars{display:flex;flex-direction:column;gap:7px;}
  .stock-item{display:flex;align-items:center;gap:10px;}
  .stock-name{font-size:0.75rem;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .stock-bar-wrap{flex:1.5;height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
  .stock-bar{height:100%;border-radius:3px;transition:width 1s ease;}
  .bar-green{background:var(--green);}
  .bar-orange{background:var(--orange);}
  .bar-red{background:var(--red);}
  .stock-count{font-size:0.72rem;font-family:var(--mono);font-weight:600;min-width:28px;text-align:right;}

  /* MISMATCH SECTION */
  .mismatch-card{
    background:var(--surface);border:1px solid rgba(255,77,109,0.25);
    border-radius:12px;padding:16px;margin-bottom:10px;
  }
  .mismatch-product{font-size:0.88rem;font-weight:700;margin-bottom:8px;}
  .mismatch-row{
    display:flex;justify-content:space-between;align-items:center;
    font-size:0.75rem;padding:6px 0;border-bottom:1px solid var(--border);
  }
  .mismatch-row:last-child{border-bottom:none;}
  .mismatch-loc{color:var(--muted);}
  .mismatch-val{font-family:var(--mono);font-weight:600;}
  .mismatch-val.high{color:var(--green);}
  .mismatch-val.low{color:var(--red);}
  .mismatch-val.online{color:var(--blue);}

  /* TRANSFER MODAL */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.75);
    z-index:200;display:flex;align-items:flex-end;
    animation:fadeIn 0.2s ease;
  }
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .modal{
    background:var(--surface);border:1px solid var(--border);
    border-radius:20px 20px 0 0;padding:24px 20px 36px;
    width:100%;animation:slideUp 0.3s ease;
  }
  @keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .modal-title{font-size:1rem;font-weight:700;margin-bottom:6px;}
  .modal-sub{font-size:0.8rem;color:var(--muted);margin-bottom:20px;}
  .modal-label{font-size:0.73rem;color:var(--muted);font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.8px;}
  .modal-select{
    width:100%;background:var(--surface2);border:1px solid var(--border);
    color:var(--text);font-family:var(--font);font-size:0.88rem;
    padding:12px 14px;border-radius:10px;margin-bottom:14px;outline:none;
  }
  .modal-qty{
    display:flex;align-items:center;gap:12px;margin-bottom:20px;
  }
  .qty-btn{
    width:40px;height:40px;background:var(--surface2);border:1px solid var(--border);
    color:var(--text);font-size:1.2rem;border-radius:10px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .qty-val{font-size:1.3rem;font-weight:700;font-family:var(--mono);flex:1;text-align:center;}
  .btn-transfer{
    width:100%;background:var(--green);color:#000;
    font-family:var(--font);font-size:0.95rem;font-weight:700;
    padding:15px;border-radius:12px;border:none;cursor:pointer;
    transition:opacity 0.2s;
  }
  .btn-transfer:hover{opacity:0.9;}
  .btn-cancel{
    width:100%;background:transparent;color:var(--muted);
    font-family:var(--font);font-size:0.85rem;font-weight:500;
    padding:12px;border-radius:12px;border:none;cursor:pointer;margin-top:8px;
  }

  /* SUCCESS TOAST */
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--green);color:#000;
    font-weight:700;font-size:0.85rem;
    padding:12px 24px;border-radius:100px;
    animation:toastIn 0.3s ease;z-index:300;white-space:nowrap;
  }
  @keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}

  /* EMPTY STATE */
  .empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:0.85rem;}

  /* BOTTOM NAV */
  .bottom-nav{
    position:fixed;bottom:0;left:0;right:0;
    background:rgba(10,15,30,0.97);border-top:1px solid var(--border);
    display:flex;justify-content:space-around;padding:10px 0 20px;
    backdrop-filter:blur(12px);z-index:100;
  }
  .nav-item{
    display:flex;flex-direction:column;align-items:center;gap:4px;
    font-size:0.65rem;color:var(--muted);cursor:pointer;
    padding:4px 16px;transition:color 0.2s;font-weight:600;
  }
  .nav-item.active{color:var(--green);}
  .nav-item svg{width:20px;height:20px;}
  .pb{height:80px;}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="logo">stock<span>os</span></div>
  <div class="live-badge"><span class="live-dot"></span> LIVE</div>
</div>

<!-- TABS -->
<div class="tabs" id="tabs">
  <div class="tab active" onclick="switchTab('overview')">Overview</div>
  <div class="tab" onclick="switchTab('locations')">Locations</div>
  <div class="tab" onclick="switchTab('mismatches')">Mismatches</div>
  <div class="tab" onclick="switchTab('transfer')">Transfer</div>
</div>

<div class="main" id="main-content"></div>
<div class="pb"></div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <div class="nav-item active" onclick="switchTab('overview')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    Overview
  </div>
  <div class="nav-item" onclick="switchTab('locations')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
    Locations
  </div>
  <div class="nav-item" onclick="switchTab('mismatches')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    Alerts
  </div>
  <div class="nav-item" onclick="switchTab('transfer')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>
    Transfer
  </div>
</div>

<script>
const STORE = {
  name: "GreenPaws Pet Supply",
  locations: [
    {
      id: 1,
      name: "Koramangala",
      address: "5th Block, Koramangala",
      status: "alert",
      items: [
        {name:"Royal Canin Adult 3kg", stock:4, max:50},
        {name:"Pedigree Chicken 1.2kg", stock:31, max:50},
        {name:"Whiskas Tuna Pouch", stock:3, max:40},
        {name:"Pet Collar Medium", stock:18, max:30},
      ]
    },
    {
      id: 2,
      name: "Indiranagar",
      address: "12th Main, Indiranagar",
      status: "good",
      items: [
        {name:"Royal Canin Adult 3kg", stock:42, max:50},
        {name:"Pedigree Chicken 1.2kg", stock:27, max:50},
        {name:"Whiskas Tuna Pouch", stock:35, max:40},
        {name:"Pet Collar Medium", stock:22, max:30},
      ]
    },
    {
      id: 3,
      name: "HSR Layout",
      address: "Sector 2, HSR Layout",
      status: "warn",
      items: [
        {name:"Royal Canin Adult 3kg", stock:11, max:50},
        {name:"Pedigree Chicken 1.2kg", stock:8, max:50},
        {name:"Whiskas Tuna Pouch", stock:19, max:40},
        {name:"Pet Collar Medium", stock:6, max:30},
      ]
    }
  ],
  mismatches: [
    {
      product:"Royal Canin Adult 3kg",
      online: 38,
      locations:[
        {name:"Koramangala", stock:4, status:"low"},
        {name:"Indiranagar", stock:42, status:"high"},
        {name:"HSR Layout", stock:11, status:"low"},
      ]
    },
    {
      product:"Whiskas Tuna Pouch 85g",
      online: 30,
      locations:[
        {name:"Koramangala", stock:3, status:"low"},
        {name:"Indiranagar", stock:35, status:"high"},
        {name:"HSR Layout", stock:19, status:"low"},
      ]
    }
  ]
};

let currentTab = 'overview';
let transferQty = 5;
let showModal = false;
let showToast = false;

function getStatusBadge(status){
  if(status==='alert') return '<span class="loc-badge badge-alert">Needs Restock</span>';
  if(status==='warn') return '<span class="loc-badge badge-warn">Running Low</span>';
  return '<span class="loc-badge badge-ok">Stocked</span>';
}

function getBarClass(stock, max){
  const pct = stock/max;
  if(pct > 0.5) return 'bar-green';
  if(pct > 0.2) return 'bar-orange';
  return 'bar-red';
}

function getCountColor(stock, max){
  const pct = stock/max;
  if(pct > 0.5) return 'color:var(--green)';
  if(pct > 0.2) return 'color:var(--orange)';
  return 'color:var(--red)';
}

function renderOverview(){
  const totalSKUs = 847;
  const lowStock = 6;
  const mismatches = 2;
  return `
    <div class="alert-banner" onclick="switchTab('mismatches')">
      <div class="alert-icon">⚠️</div>
      <div>
        <div class="alert-title">2 Stock Mismatches Detected</div>
        <div class="alert-desc">Royal Canin Adult 3kg shows 38 units available online -- but Koramangala only has 4 in store. Customers may arrive for nothing.</div>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-card good">
        <div class="stat-num">${totalSKUs}</div>
        <div class="stat-label">Total SKUs</div>
      </div>
      <div class="stat-card danger">
        <div class="stat-num">${lowStock}</div>
        <div class="stat-label">Low Stock</div>
      </div>
      <div class="stat-card warn">
        <div class="stat-num">${mismatches}</div>
        <div class="stat-label">Mismatches</div>
      </div>
    </div>

    <div class="section-title">All Locations</div>
    ${STORE.locations.map(loc => `
      <div class="loc-card ${loc.status==='alert'?'alert-loc':loc.status==='warn'?'warn-loc':''}" onclick="switchTab('locations')">
        <div class="loc-header">
          <div>
            <div class="loc-name">${loc.name}</div>
            <div class="loc-address">${loc.address}</div>
          </div>
          ${getStatusBadge(loc.status)}
        </div>
        <div class="stock-bars">
          ${loc.items.slice(0,3).map(item => `
            <div class="stock-item">
              <div class="stock-name">${item.name}</div>
              <div class="stock-bar-wrap">
                <div class="stock-bar ${getBarClass(item.stock,item.max)}" style="width:${Math.round(item.stock/item.max*100)}%"></div>
              </div>
              <div class="stock-count" style="${getCountColor(item.stock,item.max)}">${item.stock}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `).join('')}
  `;
}

function renderLocations(){
  return `
    <div class="section-title">3 Locations</div>
    ${STORE.locations.map(loc => `
      <div class="loc-card ${loc.status==='alert'?'alert-loc':loc.status==='warn'?'warn-loc':''}">
        <div class="loc-header">
          <div>
            <div class="loc-name">${loc.name}</div>
            <div class="loc-address">${loc.address}</div>
          </div>
          ${getStatusBadge(loc.status)}
        </div>
        <div class="stock-bars">
          ${loc.items.map(item => `
            <div class="stock-item">
              <div class="stock-name">${item.name}</div>
              <div class="stock-bar-wrap">
                <div class="stock-bar ${getBarClass(item.stock,item.max)}" style="width:${Math.round(item.stock/item.max*100)}%"></div>
              </div>
              <div class="stock-count" style="${getCountColor(item.stock,item.max)}">${item.stock}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `).join('')}
  `;
}

function renderMismatches(){
  return `
    <div class="alert-banner">
      <div class="alert-icon">🔴</div>
      <div>
        <div class="alert-title">2 items showing wrong availability online</div>
        <div class="alert-desc">These items show stock online but one or more locations are nearly empty. Customers will be disappointed.</div>
      </div>
    </div>

    <div class="section-title">Mismatch Details</div>
    ${STORE.mismatches.map(m => `
      <div class="mismatch-card">
        <div class="mismatch-product">📦 ${m.product}</div>
        <div class="mismatch-row">
          <span class="mismatch-loc">🌐 Online shows available</span>
          <span class="mismatch-val online">${m.online} units</span>
        </div>
        ${m.locations.map(l => `
          <div class="mismatch-row">
            <span class="mismatch-loc">📍 ${l.name}</span>
            <span class="mismatch-val ${l.status}">${l.stock} in store</span>
          </div>
        `).join('')}
      </div>
    `).join('')}
  `;
}

function renderTransfer(){
  return `
    <div class="section-title">Quick Stock Transfer</div>
    <p style="font-size:0.82rem;color:var(--muted);margin-bottom:16px;line-height:1.6;">Move stock between locations instantly. StockOS updates all systems automatically.</p>

    <div class="loc-card alert-loc">
      <div class="loc-header">
        <div>
          <div class="loc-name">Koramangala -- Critical</div>
          <div class="loc-address">Royal Canin Adult 3kg: only 4 left</div>
        </div>
        <span class="loc-badge badge-alert">Needs Stock</span>
      </div>
    </div>

    <div style="text-align:center;padding:8px 0;color:var(--muted);font-size:1.2rem;">↓</div>

    <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;">
      <div style="font-size:0.72rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:12px;">Transfer From</div>
      <div style="font-size:0.9rem;font-weight:700;margin-bottom:4px;">Indiranagar</div>
      <div style="font-size:0.75rem;color:var(--muted);">Royal Canin Adult 3kg: 42 available</div>
    </div>

    <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:20px;">
      <div style="font-size:0.72rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:12px;">Units to Transfer</div>
      <div class="modal-qty">
        <button class="qty-btn" onclick="changeQty(-5)">-</button>
        <div class="qty-val" id="qty-display">${transferQty}</div>
        <button class="qty-btn" onclick="changeQty(5)">+</button>
      </div>
    </div>

    <button class="btn-transfer" onclick="doTransfer()">Confirm Transfer -- ${transferQty} Units</button>
    <p style="text-align:center;font-size:0.75rem;color:var(--muted);margin-top:12px;">Koramangala will show ${4+transferQty} units after transfer</p>
  `;
}

function changeQty(delta){
  transferQty = Math.max(1, Math.min(20, transferQty + delta));
  const d = document.getElementById('qty-display');
  if(d) d.textContent = transferQty;
  const btn = document.querySelector('.btn-transfer');
  if(btn){
    btn.textContent = `Confirm Transfer -- ${transferQty} Units`;
    btn.nextElementSibling.textContent = `Koramangala will show ${4+transferQty} units after transfer`;
  }
}

function doTransfer(){
  // Update data
  STORE.locations[0].items[0].stock += transferQty;
  STORE.locations[1].items[0].stock -= transferQty;
  STORE.locations[0].status = 'warn';

  // Show toast
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = `Transfer done. Koramangala updated.`;
  document.body.appendChild(toast);
  setTimeout(()=>toast.remove(), 2500);

  // Re-render
  setTimeout(()=>switchTab('overview'), 400);
}

function switchTab(tab){
  currentTab = tab;
  // Update tab UI
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  const tabMap = {overview:0,locations:1,mismatches:2,transfer:3};
  document.querySelectorAll('.tab')[tabMap[tab]]?.classList.add('active');
  // Update bottom nav
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.querySelectorAll('.nav-item')[tabMap[tab]]?.classList.add('active');
  // Render content
  const content = document.getElementById('main-content');
  if(tab==='overview') content.innerHTML = renderOverview();
  else if(tab==='locations') content.innerHTML = renderLocations();
  else if(tab==='mismatches') content.innerHTML = renderMismatches();
  else if(tab==='transfer') content.innerHTML = renderTransfer();
}

// Initial render
switchTab('overview');
</script>
</body>
</html>
